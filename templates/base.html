<!doctype html>
<html lang="en" data-bs-theme="light">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="csrf-token" content="{{ csrf_token }}">
    <meta name="color-scheme" content="light dark">
    <title>{{ title }}</title>
    <link rel="icon" href="favicon.ico">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32x32.png">
    <!-- Served from the daemon, not a CDN: this console has to work on hosts with no
         egress, and a root-privileged UI should not depend on a third-party origin. -->
    <link href="static/bootstrap.css" rel="stylesheet">
    <link href="static/app.css" rel="stylesheet">
    <script>
      // Resolve the theme before first paint so a dark-mode operator never gets a
      // white flash. Stored choice wins; otherwise follow the OS.
      (function () {
        try {
          var stored = localStorage.getItem("pm-theme");
          var theme = stored
            || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
          document.documentElement.setAttribute("data-bs-theme", theme);
        } catch (e) { /* private mode: fall back to the light default */ }
      })();
    </script>
  </head>
  <body>
    <nav class="navbar pm-navbar">
      <div class="container-fluid">
        <a class="navbar-brand d-inline-flex align-items-center" href="status">
          <img src="static/logo.png" width="26" height="26" alt="" style="border-radius: 7px;">
          <span>
            <span class="pm-brand-name">ProcessMaster</span>
            <span class="pm-brand-meta">{{ build_banner }}</span>
          </span>
        </a>
        <button id="btn-theme" class="btn pm-theme-toggle" type="button"
                title="Toggle light / dark theme" aria-label="Toggle light or dark theme">
          <svg class="pm-icon pm-icon-sun" width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
            <path d="M8 11a3 3 0 1 1 0-6 3 3 0 0 1 0 6m0 1a4 4 0 1 0 0-8 4 4 0 0 0 0 8M8 0a.5.5 0 0 1 .5.5v2a.5.5 0 0 1-1 0v-2A.5.5 0 0 1 8 0m0 13a.5.5 0 0 1 .5.5v2a.5.5 0 0 1-1 0v-2A.5.5 0 0 1 8 13m8-5a.5.5 0 0 1-.5.5h-2a.5.5 0 0 1 0-1h2a.5.5 0 0 1 .5.5M3 8a.5.5 0 0 1-.5.5h-2a.5.5 0 0 1 0-1h2A.5.5 0 0 1 3 8m10.657-5.657a.5.5 0 0 1 0 .707l-1.414 1.415a.5.5 0 1 1-.707-.708l1.414-1.414a.5.5 0 0 1 .707 0m-9.193 9.193a.5.5 0 0 1 0 .707L3.05 13.657a.5.5 0 0 1-.707-.707l1.414-1.414a.5.5 0 0 1 .707 0m9.193 2.121a.5.5 0 0 1-.707 0l-1.414-1.414a.5.5 0 0 1 .707-.707l1.414 1.414a.5.5 0 0 1 0 .707M4.464 4.465a.5.5 0 0 1-.707 0L2.343 3.05a.5.5 0 1 1 .707-.707l1.414 1.414a.5.5 0 0 1 0 .708"/>
          </svg>
          <svg class="pm-icon pm-icon-moon" width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
            <path d="M6 .278a.77.77 0 0 1 .08.858 7.2 7.2 0 0 0-.878 3.46c0 4.021 3.278 7.277 7.318 7.277q.792-.001 1.533-.16a.79.79 0 0 1 .81.316.73.73 0 0 1-.031.893A8.35 8.35 0 0 1 8.344 16C3.734 16 0 12.286 0 7.71 0 4.266 2.114 1.312 5.124.06A.75.75 0 0 1 6 .278"/>
          </svg>
        </button>
      </div>
    </nav>

    <main class="container-fluid py-3">
      {% block content %}{% endblock %}
    </main>

    <script src="static/bootstrap.bundle.js"></script>
    <script>
      (function () {
        var btn = document.getElementById("btn-theme");
        if (!btn) return;
        btn.addEventListener("click", function () {
          var root = document.documentElement;
          var next = root.getAttribute("data-bs-theme") === "dark" ? "light" : "dark";
          root.setAttribute("data-bs-theme", next);
          try { localStorage.setItem("pm-theme", next); } catch (e) { /* ignore */ }
        });
      })();
    </script>
    {% block scripts %}{% endblock %}
  </body>
</html>
